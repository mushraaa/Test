<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Простая кухня в VR (A-Frame)</title>
    <!-- Подключаем A-Frame -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
</head>
<body>
    <!-- Сцена с базовым освещением и возможностью входа в VR -->
    <a-scene background="color: #111" vr-mode-ui="enabled: true">
        <!-- Освещение: окружающий свет и направленный свет для теней (если включить) -->
        <a-light type="ambient" color="#fff" intensity="0.4"></a-light>
        <a-light type="directional" color="#fff" intensity="0.8" position="2 5 3"></a-light>

        <!-- Пол кухни (с текстурой дерева) -->
        <a-plane src="https://cdn.aframe.io/aframe-live/examples/assets/floor.jpg" 
                 repeat="4 4" width="8" height="6" rotation="-90 0 0" position="4 0 3"
                 material="side: double"></a-plane>

        <!-- Стены: задняя стена (по оси -z) -->
        <a-box position="4 2 -1" width="8" height="4" depth="0.2" color="#aaa"></a-box>
        <!-- Левая стена (по оси x) -->
        <a-box position="0 2 3" width="0.2" height="4" depth="6" color="#bbb"></a-box>
        <!-- Правая стена -->
        <a-box position="8 2 3" width="0.2" height="4" depth="6" color="#bbb"></a-box>
        <!-- Передняя стена частично открыта, но можно сделать небольшую стену справа от входа -->

        <!-- Кухонный гарнитур: нижние шкафы (линия вдоль задней стены) -->
        <!-- Основание (длинный шкаф) -->
        <a-box position="2 0.5 0.5" width="4" height="1" depth="0.6" color="#8B4513"></a-box>
        <a-box position="6 0.5 0.5" width="2" height="1" depth="0.6" color="#8B4513"></a-box>
        <!-- Верхние шкафы -->
        <a-box position="2 2.2 0.5" width="2" height="1" depth="0.6" color="#CD853F"></a-box>
        <a-box position="4.5 2.2 0.5" width="1.5" height="1" depth="0.6" color="#CD853F"></a-box>

        <!-- Столешница (тонкая плита поверх нижних шкафов) -->
        <a-box position="4 1.1 0.5" width="6.5" height="0.1" depth="0.7" color="#D3D3D3"></a-box>

        <!-- Раковина (цилиндр + маленький куб-кран) -->
        <a-cylinder position="2.5 1.2 0.5" radius="0.3" height="0.1" color="#C0C0C0"></a-cylinder>
        <a-box position="2.5 1.4 0.55" width="0.1" height="0.2" depth="0.1" color="#555"></a-box>

        <!-- Плита (черная поверхность с конфорками) -->
        <a-box position="5.5 1.15 0.5" width="1.2" height="0.05" depth="0.6" color="#333"></a-box>
        <!-- Конфорки (маленькие цилиндры) -->
        <a-cylinder position="5.1 1.2 0.3" radius="0.15" height="0.02" color="#888"></a-cylinder>
        <a-cylinder position="5.9 1.2 0.3" radius="0.15" height="0.02" color="#888"></a-cylinder>
        <a-cylinder position="5.1 1.2 0.7" radius="0.15" height="0.02" color="#888"></a-cylinder>
        <a-cylinder position="5.9 1.2 0.7" radius="0.15" height="0.02" color="#888"></a-cylinder>

        <!-- Холодильник (высокий белый прямоугольник) -->
        <a-box position="7 1.5 1.8" width="0.8" height="3" depth="0.7" color="white"></a-box>
        <a-box position="7 1.5 1.8" width="0.1" height="1.2" depth="0.1" color="#888" 
               material="metalness:0.8; roughness:0.2"></a-box> <!-- ручка -->

        <!-- Обеденный стол и стулья (в центре кухни) -->
        <!-- Стол (столешница) -->
        <a-box position="4 1 3.5" width="2" height="0.1" depth="1.5" color="#A0522D"></a-box>
        <!-- Ножки стола -->
        <a-cylinder position="3.2 0.5 3" radius="0.1" height="1" color="#8B4513"></a-cylinder>
        <a-cylinder position="4.8 0.5 3" radius="0.1" height="1" color="#8B4513"></a-cylinder>
        <a-cylinder position="3.2 0.5 4" radius="0.1" height="1" color="#8B4513"></a-cylinder>
        <a-cylinder position="4.8 0.5 4" radius="0.1" height="1" color="#8B4513"></a-cylinder>

        <!-- Стулья (сиденья и спинки) -->
        <!-- Стул слева от стола -->
        <a-box position="2.5 0.5 3.5" width="0.8" height="0.1" depth="0.8" color="#D2B48C"></a-box>
        <a-box position="2.5 1 3.5" width="0.8" height="0.8" depth="0.1" color="#D2B48C"></a-box>
        <!-- Стул справа от стола -->
        <a-box position="5.5 0.5 3.5" width="0.8" height="0.1" depth="0.8" color="#D2B48C"></a-box>
        <a-box position="5.5 1 3.5" width="0.8" height="0.8" depth="0.1" color="#D2B48C"></a-box>

        <!-- Добавим простые окна на задней стене (имитация) -->
        <a-plane position="2 2.5 -0.8" width="1.5" height="1.5" color="#87CEEB" 
                 material="side:double; transparent:true; opacity:0.6"></a-plane>
        <a-plane position="6 2.5 -0.8" width="1.5" height="1.5" color="#87CEEB" 
                 material="side:double; transparent:true; opacity:0.6"></a-plane>

        <!-- Небольшая люстра в центре потолка -->
        <a-sphere position="4 4 3" radius="0.2" color="yellow"></a-sphere>

        <!-- Камера с возможностью телепортации (стандартный контроллер A-Frame) -->
        <a-entity camera look-controls wasd-controls position="4 1.8 5"></a-entity>

        <!-- Добавим сетку на пол для лучшей ориентации (опционально) -->
        <a-grid position="4 0.01 3" width="8" height="6" divisions="10" color="#AAA"></a-grid>
    </a-scene>
</body>
</html>
