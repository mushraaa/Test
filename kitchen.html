<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Кухня в реальном масштабе (VR)</title>
    <script src="aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>
</head>
<body>
    <a-scene background="color: #111" vr-mode-ui="enabled: true">
        <!-- Освещение -->
        <a-light type="ambient" color="#fff" intensity="0.5"></a-light>
        <a-light type="directional" color="#fff" intensity="0.8" position="2 4 3"></a-light>

        <!-- Пол 4x3 метра -->
        <a-plane src="https://cdn.aframe.io/aframe-live/examples/assets/floor.jpg" 
                 repeat="2 2" width="4" height="3" rotation="-90 0 0" position="2 0 1.5"
                 material="side: double"></a-plane>

        <!-- Задняя стена -->
        <a-box position="2 1.25 -0.5" width="4" height="2.5" depth="0.2" color="#aaa"></a-box>
        <!-- Левая стена -->
        <a-box position="0 1.25 1.5" width="0.2" height="2.5" depth="3" color="#bbb"></a-box>
        <!-- Правая стена -->
        <a-box position="4 1.25 1.5" width="0.2" height="2.5" depth="3" color="#bbb"></a-box>

        <!-- Нижние шкафы (вдоль задней стены) -->
        <a-box position="1 0.4 0.2" width="1.8" height="0.8" depth="0.5" color="#8B4513"></a-box>
        <a-box position="3 0.4 0.2" width="1.8" height="0.8" depth="0.5" color="#8B4513"></a-box>
        <!-- Верхние шкафы -->
        <a-box position="1 1.6 0.2" width="1.4" height="0.8" depth="0.5" color="#CD853F"></a-box>
        <a-box position="2.7 1.6 0.2" width="1.4" height="0.8" depth="0.5" color="#CD853F"></a-box>

        <!-- Столешница -->
        <a-box position="2 0.85 0.2" width="3.8" height="0.05" depth="0.6" color="#D3D3D3"></a-box>

        <!-- Раковина -->
        <a-cylinder position="1.2 0.9 0.2" radius="0.2" height="0.1" color="#C0C0C0"></a-cylinder>
        <a-box position="1.2 1.05 0.22" width="0.08" height="0.2" depth="0.08" color="#555"></a-box>

        <!-- Плита -->
        <a-box position="2.8 0.9 0.2" width="0.9" height="0.05" depth="0.5" color="#333"></a-box>
        <a-cylinder position="2.6 0.95 0.1" radius="0.1" height="0.02" color="#888"></a-cylinder>
        <a-cylinder position="3.0 0.95 0.1" radius="0.1" height="0.02" color="#888"></a-cylinder>
        <a-cylinder position="2.6 0.95 0.3" radius="0.1" height="0.02" color="#888"></a-cylinder>
        <a-cylinder position="3.0 0.95 0.3" radius="0.1" height="0.02" color="#888"></a-cylinder>

        <!-- Холодильник -->
        <a-box position="3.5 0.9 1.1" width="0.6" height="1.8" depth="0.6" color="white"></a-box>
        <a-box position="3.5 0.9 1.1" width="0.1" height="0.8" depth="0.1" color="#888"></a-box>

        <!-- Стол и стулья -->
        <a-box position="2 0.6 1.8" width="1.2" height="0.1" depth="0.9" color="#A0522D"></a-box>
        <a-cylinder position="1.5 0.2 1.5" radius="0.08" height="0.5" color="#8B4513"></a-cylinder>
        <a-cylinder position="2.5 0.2 1.5" radius="0.08" height="0.5" color="#8B4513"></a-cylinder>
        <a-cylinder position="1.5 0.2 2.1" radius="0.08" height="0.5" color="#8B4513"></a-cylinder>
        <a-cylinder position="2.5 0.2 2.1" radius="0.08" height="0.5" color="#8B4513"></a-cylinder>

        <!-- Стул слева -->
        <a-box position="1.2 0.25 1.8" width="0.5" height="0.1" depth="0.5" color="#D2B48C"></a-box>
        <a-box position="1.2 0.6 1.8" width="0.5" height="0.5" depth="0.1" color="#D2B48C"></a-box>
        <!-- Стул справа -->
        <a-box position="2.8 0.25 1.8" width="0.5" height="0.1" depth="0.5" color="#D2B48C"></a-box>
        <a-box position="2.8 0.6 1.8" width="0.5" height="0.5" depth="0.1" color="#D2B48C"></a-box>

        <!-- Окна -->
        <a-plane position="1 1.5 -0.4" width="1.2" height="1.2" color="#87CEEB" 
                 material="side:double; transparent:true; opacity:0.5"></a-plane>
        <a-plane position="3 1.5 -0.4" width="1.2" height="1.2" color="#87CEEB" 
                 material="side:double; transparent:true; opacity:0.5"></a-plane>

        <!-- Люстра -->
        <a-sphere position="2 2.4 1.5" radius="0.15" color="yellow"></a-sphere>

        <!-- Камера (стартовая позиция) -->
        <!--<a-entity camera look-controls wasd-controls position="2 1 2.5"></a-entity>-->
        <a-entity movement-controls="controls: handcontrols; speed: 0.5" position="2 1 2.5" camera look-controls></a-entity>
        <a-entity oculus-touch-controls="hand: left"></a-entity>
        <a-entity oculus-touch-controls="hand: right"></a-entity>

        <!-- Вспомогательная сетка (по желанию) -->
        <a-grid position="2 0.01 1.5" width="4" height="3" divisions="8" color="#888"></a-grid>
    </a-scene>
</body>
</html>
